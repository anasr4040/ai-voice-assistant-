[project]
name = "fahrschule-infinity-receptionist"
version = "0.1.0"
description = "AI voice receptionist for Fahrschule Infinity Hamburg"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[websocket,webrtc,runner,deepgram,google,anthropic]>=1.10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "loguru>=0.7",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receptionist"]
